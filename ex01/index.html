<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Positioning Exercise</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Fixed Navigation Bar -->
    <nav class="navbar">
        <h2>My Website</h2>
        <div>
            <a href="home">Home</a>
            <a href="about">About</a>
            <a href="contact">Contact</a>
        </div>
    </nav>

    <!-- Main Content -->
    <main>
        <h1>Positioning Exercise</h1>

        <div class="card">

            <!-- Absolute Badge -->
            <span class="badge">NEW</span>

            <h2>Welcome!</h2>
            <p>
                This is a card using relative positioning.
                The notification badge is positioned absolutely
                inside the card.
            </p>

            <p>
                Scroll down to see the fixed navigation bar
                and the back-to-top button.
            </p>

        </div>

        <div class="space">
            <p>Scroll down...</p>
        </div>
    </main>

    <!-- Fixed Back-to-Top Button -->
    <a href="#" class="back-to-top">↑ Top</a>

</body>
