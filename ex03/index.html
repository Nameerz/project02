<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Colors & Opacity</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <h1>Colors & Opacity</h1>

    <!-- Color Swatches -->
    <div class="swatches">

        <div class="swatch named">
            Named Color: Red
        </div>

        <div class="swatch hex">
            HEX: #3498DB
        </div>

        <div class="swatch rgb">
            RGB: rgb(46, 204, 113)
        </div>

        <div class="swatch rgba">
            RGBA: rgba(155, 89, 182, 0.5)
        </div>

    </div>

    <h2>Opacity vs RGBA</h2>

    <!-- Opacity and RGBA -->
    <div class="comparison">

        <div class=" opacity-box">
            <p>This text is affected by opacity.</p>
        </div>

        <div class=" rgba-box">
            <p>This text is not affected by background transparency.</p>
        </div>

    </div>

</body>
</html>
